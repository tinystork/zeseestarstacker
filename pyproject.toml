[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ZeSeestarStacker"
dynamic = ["version"]
description = "Alignement et empilement d'images astronomiques (Seestar S50) - ZeSeestarStacker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Tinystork" },
]
keywords = ["astronomy", "astrophotography", "stacking", "seestar", "fits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "astroquery",
    "astroalign",
    "opencv-python-headless",
    "Pillow",
    "scikit-image",
    "colour-demosaicing",
    "ccdproc",
    "photutils",
    "matplotlib",
    "psutil",
    "packaging",
    "reproject",
    "tqdm",
    "rasterio",
    "drizzle",
    "bottleneck",
    "threadpoolctl",
]

[project.optional-dependencies]
tools = [
    # Standalone visu.py image viewer (seestar/tools/visu.py)
    "PyQt5",
]

[project.gui-scripts]
zeseestarstacker = "seestar.main:main"

[tool.setuptools.dynamic]
version = { attr = "seestar.__version__" }

[tool.setuptools.packages.find]
include = ["seestar*"]

[tool.setuptools.package-data]
seestar = ["icon/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
